<script>
var DATA = {"title": "原付運転免許", "updated": "2026-10-29", "categories": [{"key": "basic", "ja": "原付の基本", "id": "Dasar moped"}, {"key": "equip", "ja": "装備・点検", "id": "Perlengkapan & pemeriksaan"}, {"key": "signal", "ja": "信号", "id": "Lampu lalu lintas"}, {"key": "sign", "ja": "標識・標示", "id": "Rambu & marka"}, {"key": "riding", "ja": "通行のしかた", "id": "Cara berkendara"}, {"key": "cross", "ja": "交差点", "id": "Persimpangan"}, {"key": "ped", "ja": "歩行者の保護", "id": "Perlindungan pejalan kaki"}, {"key": "pass", "ja": "追越し", "id": "Mendahului"}, {"key": "park", "ja": "駐車・停車", "id": "Parkir & berhenti"}, {"key": "rail", "ja": "踏切", "id": "Perlintasan kereta api"}, {"key": "alcohol", "ja": "飲酒・携帯電話", "id": "Alkohol & telepon seluler"}, {"key": "accident", "ja": "事故のとき", "id": "Saat kecelakaan"}, {"key": "twostep", "ja": "二段階右折", "id": "Belok kanan moped"}], "questions": [{"no": 1, "cat": "basic", "answer": true, "by": "claude", "ja": "原付免許では、総排気量50cc以下の原動機付自転車を運転することができる。", "id": "Dengan SIM moped, Anda boleh mengemudikan moped dengan kapasitas mesin 50 cc atau kurang.", "exp_ja": "総排気量50cc以下の原動機付自転車は、原付免許で運転できる。", "exp_id": "Moped dengan kapasitas mesin 50 cc atau kurang boleh dikemudikan dengan SIM moped.", "confirmed": false}, {"no": 2, "cat": "basic", "answer": true, "by": "claude", "ja": "原付免許では、総排気量125cc以下で、最高出力が4.0キロワット以下の二輪車も運転することができる。", "id": "Dengan SIM moped, Anda juga boleh mengemudikan kendaraan roda dua dengan kapasitas mesin 125 cc atau kurang dan daya maksimum 4,0 kW atau kurang.", "exp_ja": "令和7年4月1日から、この区分の二輪車（新基準原付）も原付免許で運転できるようになった。", "exp_id": "Sejak 1 April 2025, kendaraan roda dua dalam kategori ini juga boleh dikemudikan dengan SIM moped.", "confirmed": false}, {"no": 3, "cat": "basic", "answer": false, "by": "claude", "ja": "総排気量が125cc以下であれば、最高出力に関係なく原付免許で運転することができる。", "id": "Selama kapasitas mesinnya 125 cc atau kurang, Anda boleh mengemudikannya dengan SIM moped tanpa melihat daya maksimumnya.", "exp_ja": "最高出力が4.0キロワットを超える二輪車は、原付免許では運転できない。", "exp_id": "Kendaraan roda dua dengan daya maksimum lebih dari 4,0 kW tidak boleh dikemudikan dengan SIM moped.", "confirmed": false}, {"no": 4, "cat": "basic", "answer": true, "by": "claude", "ja": "標識などで最高速度が指定されていない道路では、原動機付自転車の最高速度は時速30キロメートルである。", "id": "Di jalan yang batas kecepatannya tidak ditentukan dengan rambu dan sebagainya, batas kecepatan paling tinggi moped adalah 30 km/jam.", "exp_ja": "原動機付自転車の最高速度は、時速30キロメートルと決められている。", "exp_id": "Batas kecepatan paling tinggi moped ditetapkan 30 km/jam.", "confirmed": false}, {"no": 5, "cat": "basic", "answer": false, "by": "claude", "ja": "標識で最高速度が時速40キロメートルと指定されている道路では、原動機付自転車も時速40キロメートルまで出すことができる。", "id": "Di jalan yang batas kecepatan paling tingginya ditetapkan 40 km/jam dengan rambu, moped juga boleh melaju sampai 40 km/jam.", "exp_ja": "標識で時速30キロメートルを超える速度が指定されていても、原動機付自転車は時速30キロメートルを超えてはならない。", "exp_id": "Walaupun rambu menunjukkan kecepatan lebih dari 30 km/jam, moped tidak boleh melebihi 30 km/jam.", "confirmed": false}, {"no": 6, "cat": "basic", "answer": false, "by": "claude", "ja": "原動機付自転車は、後ろに荷台があれば二人乗りをすることができる。", "id": "Moped boleh digunakan untuk membonceng orang jika ada rak barang di belakangnya.", "exp_ja": "荷台があっても、原動機付自転車で二人乗りをしてはならない。", "exp_id": "Walaupun ada rak barang, Anda tidak boleh membonceng orang dengan moped.", "confirmed": false}, {"no": 7, "cat": "basic", "answer": true, "by": "claude", "ja": "原動機付自転車を運転するときは、運転免許証を携帯しなければならない。", "id": "Saat mengemudikan moped, Anda harus membawa SIM.", "exp_ja": "運転するときは、必ず運転免許証を持っていなければならない。", "exp_id": "Saat mengemudi, Anda wajib selalu membawa SIM.", "confirmed": false}, {"no": 8, "cat": "basic", "answer": true, "by": "claude", "ja": "「自動車専用」の標識がある道路を、原動機付自転車で通行してはならない。", "id": "Anda tidak boleh mengemudikan moped di jalan yang memiliki rambu \"jalan khusus kendaraan bermotor\".", "exp_ja": "この標識がある道路は、原動機付自転車は通行できない。", "exp_id": "Moped tidak boleh melewati jalan yang memiliki rambu ini.", "confirmed": false}, {"no": 9, "cat": "basic", "answer": true, "by": "claude", "ja": "原動機付自転車のエンジンを止めて押して歩くときは、歩行者として扱われ、歩道を通行することができる。", "id": "Saat Anda mematikan mesin moped dan mendorongnya sambil berjalan, Anda dianggap sebagai pejalan kaki dan boleh lewat di trotoar.", "exp_ja": "エンジンを止めて押して歩く場合は、歩行者として扱われる。", "exp_id": "Jika mesin dimatikan dan moped didorong sambil berjalan, Anda dianggap sebagai pejalan kaki.", "confirmed": false}, {"no": 10, "cat": "basic", "answer": false, "by": "claude", "ja": "原動機付自転車のエンジンをかけたままでも、押して歩けば歩道を通行することができる。", "id": "Walaupun mesin moped tetap menyala, Anda boleh lewat di trotoar asalkan mendorongnya sambil berjalan.", "exp_ja": "エンジンをかけたままでは歩行者として扱われないため、歩道を通行できない。", "exp_id": "Jika mesin tetap menyala, Anda tidak dianggap sebagai pejalan kaki, jadi tidak boleh lewat di trotoar.", "confirmed": false}, {"no": 11, "cat": "equip", "answer": true, "by": "claude", "ja": "原動機付自転車を運転するときは、乗車用ヘルメットをかぶらなければならない。", "id": "Saat mengemudikan moped, Anda wajib memakai helm.", "exp_ja": "ヘルメットをかぶらずに運転してはならない。", "exp_id": "Anda tidak boleh mengemudi tanpa memakai helm.", "confirmed": false}, {"no": 12, "cat": "equip", "answer": false, "by": "claude", "ja": "近い距離を走るときは、ヘルメットのあごひもを締めなくてもよい。", "id": "Jika hanya berkendara jarak dekat, Anda tidak perlu mengencangkan tali dagu helm.", "exp_ja": "距離に関係なく、あごひもをしっかり締める。締めないと、転倒したときにヘルメットが脱げてしまう。", "exp_id": "Tanpa melihat jaraknya, kencangkan tali dagu dengan baik. Jika tidak, helm bisa terlepas saat Anda terjatuh.", "confirmed": false}, {"no": 13, "cat": "equip", "answer": true, "by": "claude", "ja": "工事用の安全帽は、乗車用ヘルメットの代わりにはならない。", "id": "Helm untuk pekerjaan konstruksi tidak bisa menggantikan helm untuk berkendara.", "exp_ja": "工事用安全帽は、乗車用ヘルメットとして認められない。", "exp_id": "Helm konstruksi tidak diakui sebagai helm untuk berkendara.", "confirmed": false}, {"no": 14, "cat": "equip", "answer": true, "by": "claude", "ja": "運転する前に、ブレーキやタイヤなどを点検する。", "id": "Sebelum mengemudi, periksa rem, ban, dan lain-lain.", "exp_ja": "安全に運転するため、運転する前に車両を点検する。", "exp_id": "Agar berkendara dengan aman, periksa kendaraan sebelum mengemudi.", "confirmed": false}, {"no": 15, "cat": "equip", "answer": true, "by": "claude", "ja": "夜間に道路を通行するときは、前照灯をつけなければならない。", "id": "Saat berkendara di jalan pada malam hari, Anda wajib menyalakan lampu utama.", "exp_ja": "夜間は、前照灯などのライトをつけなければならない。", "exp_id": "Pada malam hari, Anda wajib menyalakan lampu utama dan lampu lainnya.", "confirmed": false}, {"no": 16, "cat": "equip", "answer": false, "by": "claude", "ja": "合図は、その行為が終わった後もしばらく続けるのがよい。", "id": "Sebaiknya isyarat tetap diberikan untuk beberapa saat setelah gerakan tersebut selesai.", "exp_ja": "合図は、その行為が終わったらすぐにやめる。続けると、周りの人が誤解するおそれがある。", "exp_id": "Isyarat harus segera dihentikan setelah gerakan selesai. Jika terus diberikan, orang di sekitar bisa salah paham.", "confirmed": false}, {"no": 17, "cat": "equip", "answer": true, "by": "claude", "ja": "ブレーキをかけるときは、前輪ブレーキと後輪ブレーキを同時にかけるのが基本である。", "id": "Saat mengerem, pada dasarnya rem roda depan dan rem roda belakang digunakan bersamaan.", "exp_ja": "前後のブレーキを同時に使うと、安定して止まることができる。", "exp_id": "Dengan menggunakan rem depan dan belakang bersamaan, Anda bisa berhenti dengan stabil.", "confirmed": false}, {"no": 18, "cat": "signal", "answer": true, "by": "claude", "ja": "黄色の灯火のときは、安全に止まることができる場合は、止まらなければならない。", "id": "Saat lampu kuning menyala, jika Anda bisa berhenti dengan aman, Anda harus berhenti.", "exp_ja": "黄色の灯火では、安全に止まれる場合は止まる。ただし、安全に止まれない場合は進むことができる。", "exp_id": "Saat lampu kuning, berhentilah jika bisa berhenti dengan aman. Namun, jika tidak bisa berhenti dengan aman, Anda boleh terus melaju.", "confirmed": false}, {"no": 19, "cat": "signal", "answer": true, "by": "claude", "ja": "黄色の灯火に変わったとき、安全に止まることができない場合は、そのまま進むことができる。", "id": "Saat lampu berubah menjadi kuning, jika Anda tidak bisa berhenti dengan aman, Anda boleh terus melaju.", "exp_ja": "急に止まると後ろの車に追突されるなど危険な場合は、そのまま進むことができる。", "exp_id": "Jika berhenti mendadak berbahaya, misalnya bisa ditabrak kendaraan dari belakang, Anda boleh terus melaju.", "confirmed": false}, {"no": 20, "cat": "signal", "answer": true, "by": "claude", "ja": "赤色の灯火のときでも、左向きの矢印が出ていれば、原動機付自転車は左折することができる。", "id": "Walaupun lampu merah menyala, jika tanda panah ke kiri menyala, moped boleh berbelok ke kiri.", "exp_ja": "矢印が出ているときは、矢印の方向に進むことができる。", "exp_id": "Saat tanda panah menyala, Anda boleh melaju ke arah yang ditunjukkan oleh tanda panah.", "confirmed": false}, {"no": 21, "cat": "signal", "answer": true, "by": "claude", "ja": "信号機の信号と警察官の手信号が違うときは、警察官の手信号に従う。", "id": "Jika isyarat lampu lalu lintas berbeda dengan isyarat tangan petugas polisi, ikuti isyarat tangan petugas polisi.", "exp_ja": "警察官の手信号が優先される。", "exp_id": "Isyarat tangan petugas polisi lebih diutamakan.", "confirmed": false}, {"no": 22, "cat": "signal", "answer": true, "by": "claude", "ja": "青色の灯火のとき、原動機付自転車は直進や左折をすることができる。", "id": "Saat lampu biru menyala, moped boleh berjalan lurus atau berbelok ke kiri.", "exp_ja": "青色の灯火では、直進や左折ができる。右折は、交差点によって方法が異なる。", "exp_id": "Saat lampu biru, Anda boleh berjalan lurus dan berbelok ke kiri. Cara berbelok ke kanan berbeda tergantung persimpangannya.", "confirmed": false}, {"no": 23, "cat": "signal", "answer": true, "by": "claude", "ja": "赤色の点滅信号のときは、一時停止して安全を確かめた後に進むことができる。", "id": "Saat lampu merah berkedip, Anda boleh melaju setelah berhenti sepenuhnya dan memastikan keselamatan.", "exp_ja": "赤色の点滅信号では、一時停止して安全を確かめなければならない。", "exp_id": "Saat lampu merah berkedip, Anda harus berhenti sepenuhnya dan memastikan keselamatan.", "confirmed": false}, {"no": 24, "cat": "signal", "answer": false, "by": "claude", "ja": "黄色の点滅信号のときは、必ず一時停止しなければならない。", "id": "Saat lampu kuning berkedip, Anda wajib berhenti sepenuhnya.", "exp_ja": "黄色の点滅信号では一時停止の必要はなく、他の交通に注意して進むことができる。", "exp_id": "Saat lampu kuning berkedip, Anda tidak perlu berhenti sepenuhnya, tetapi boleh melaju sambil memperhatikan lalu lintas lain.", "confirmed": false}, {"no": 25, "cat": "signal", "answer": false, "by": "claude", "ja": "赤色の灯火のときでも、左右から車が来ていなければ進むことができる。", "id": "Walau : "Rambu ini hanya melarang kendaraan bermotor selain roda dua, jadi moped boleh lewat.", "confirmed": false}, {"no": 37, "cat": "sign", "answer": true, "by": "claude", "ja": "道路の中央に黄色の線が引かれている道路では、追越しのために道路の右側部分にはみ出して通行してはならない。", "id": "Di jalan yang memiliki garis kuning di tengah, Anda tidak boleh keluar ke bagian kanan jalan untuk mendahului.", "exp_ja": "黄色の線を越えて追越しをしてはならない。", "exp_id": "Saat mendahului kendaraan lain, Anda tidak boleh melewati garis kuning.", "confirmed": false}, {"no": 38, "cat": "riding", "answer": true, "by": "claude", "ja": "原動機付自転車は、道路の左側を通行しなければならない。", "id": "Moped harus melaju di sisi kiri jalan.", "exp_ja": "日本では、車両は道路の左側を通行する。", "exp_id": "Di Jepang, kendaraan melaju di sisi kiri jalan.", "confirmed": false}, {"no": 39, "cat": "riding", "answer": true, "by": "claude", "ja": "原動機付自転車は、原則として歩道を通行してはならない。", "id": "Pada dasarnya, moped tidak boleh melaju di trotoar.", "exp_ja": "道路に面した場所に出入りするために横切る場合などを除き、歩道を通行してはならない。", "exp_id": "Kecuali saat melintasinya untuk keluar-masuk tempat di pinggir jalan, Anda tidak boleh melaju di trotoar.", "confirmed": false}, {"no": 40, "cat": "riding", "answer": false, "by": "claude", "ja": "車両通行帯が3つある道路では、原動機付自転車は空いていればどの車両通行帯を通行してもよい。", "id": "Di jalan yang memiliki 3 lajur, moped boleh melaju di lajur mana pun jika lajur itu kosong.", "exp_ja": "車両通行帯のある道路では、原動機付自転車は一番左側の車両通行帯を通行しなければならない。", "exp_id": "Di jalan yang memiliki lajur, moped harus melaju di lajur paling kiri.", "confirmed": false}, {"no": 41, "cat": "riding", "answer": true, "by": "claude", "ja": "進路を変えるときは、あらかじめ合図をし、安全を確かめてから行う。", "id": "Saat berpindah lajur, berikan isyarat terlebih dahulu dan pastikan keselamatan sebelum berpindah.", "exp_ja": "合図と安全確認をしてから進路を変える。", "exp_id": "Berpindah lajur setelah memberi isyarat dan memastikan keselamatan.", "confirmed": false}, {"no": 42, "cat": "riding", "answer": true, "by": "claude", "ja": "進路を変えるときの合図は、進路を変えようとするときの約3秒前に行う。", "id": "Isyarat untuk berpindah lajur diberikan kira-kira 3 detik seb laude", "ja": "「原動機付自転車の右折方法（二段階）」の標識がある交差点では、原動機付自転車は二段階右折をしなければならない。", "id": "Di persimpangan yang ada rambu yang memerintahkan moped untuk berbelok ke kanan dengan cara menyeberang dengan lampu pertama, lalu mengubah arah ke kanan, dan menyeberang lagi setelah lampu kedua menjadi biru, moped harus berbelok ke kanan dengan cara tersebut.", "exp_ja": "この標識があるときは、車両通行帯の数に関係なく二段階右折をする。", "exp_id": "Jika ada rambu ini, moped harus berbelok ke kanan dengan cara tersebut, tanpa melihat jumlah lajurnya.", "confirmed": false}, {"no": 103, "cat": "twostep", "answer": false, "by": "claude", "ja": "信号機などで交通整理が行われていない交差点でも、原動機付自転車は二段階右折をしなければならない。", "id": "Di persimpangan yang tidak diatur dengan lampu lalu lintas pun, moped harus berbelok ke kanan dengan cara menyeberang dengan lampu pertama, lalu mengubah arah ke kanan, dan menyeberang lagi setelah lampu kedua menjadi biru.", "exp_ja": "交通整理が行われていない交差点では、二段階右折はしない。", "exp_id": "Di persimpangan yang tidak diatur dengan lampu lalu lintas, moped tidak berbelok ke kanan dengan cara tersebut.", "confirmed": false}, {"no": 104, "cat": "twostep", "answer": true, "by": "claude", "ja": "二段階右折をするときは、あらかじめできるだけ道路の左端に寄り、交差点の向こう側までまっすぐ進む。", "id": "Saat berbelok ke kanan dengan cara menyeberang dengan lampu pertama, lalu mengubah arah ke kanan, dan menyeberang lagi setelah lampu kedua menjadi biru, sebelumnya mendekatlah sedekat mungkin ke tepi kiri jalan, lalu melajulah lurus sampai ke sisi seberang persimpangan.", "exp_ja": "左端に寄って、交差点の側端に沿って徐行しながら向こう側まで進む。", "exp_id": "Mendekatlah ke tepi kiri, lalu melajulah di sepanjang tepi persimpangan dengan kecepatan di mana Anda dapat siap berhenti sampai ke sisi seberang.", "confirmed": false}, {"no": 105, "cat": "twostep", "answer": true, "by": "claude", "ja": "二段階右折で交差点の向こう側に着いたら、そこで止まって右に向きを変え、前方の信号が青色になってから進む。", "id": "Saat berbelok ke kanan dengan cara tersebut, setelah sampai di sisi seberang persimpangan, berhentilah dan ubah arah ke kanan, lalu melajulah setelah lampu di depan Anda menjadi biru.", "exp_ja": "向こう側で向きを変え、前方の信号に従って進む。", "exp_id": "Setelah mengubah arah di sisi seberang, ikuti lampu lalu lintas di depan Anda.", "confirmed": false}, {"no": 106, "cat": "twostep", "answer": false, "by": "claude", "ja": "二段階右折をするときは、右折の合図をしなくてもよい。", "id": "Saat berbelok ke kanan dengan cara menyeberang dengan lampu pertama, lalu mengubah arah ke kanan, dan menyeberang lagi setelah lampu kedua menjadi biru, Anda tidak perlu memberi isyarat berbelok ke kanan.", "exp_ja": "二段階右折をするときも、30メートル手前で右折の合図をする。", "exp_id": "Dengan cara ini pun, Anda harus memberi isyarat berbelok ke kanan 30 meter sebelumnya.", "confirmed": false}, {"no": 107, "cat": "twostep", "answer": true, "by": "claude", "ja": "二段階右折をしなければならない交差点では、右向きの矢印が出ても、原動機付自転車はその矢印に従って右折することはできない。", "id": "Di persimpangan di mana moped harus berbelok ke kanan dengan cara tersebut, walaupun tanda panah ke kanan menyala, moped tidak boleh berbelok ke kanan mengikuti tanda panah itu.", "exp_ja": "このような交差点では、原動機付自転車は右向きの矢印に従って右折できない。", "exp_id": "Di persimpangan seperti ini, moped tidak boleh berbelok ke kanan mengikuti tanda panah ke kanan.", "confirmed": false}, {"no": 108, "cat": "twostep", "answer": false, "by": "claude", "ja": "「原動機付自転車の右折方法（小回り）」の標識がある交差点でも、車両通行帯が3つ以上あれば、二段階右折をしなければならない。", "id": "Di persimpangan yang ada rambu yang memerintahkan moped berbelok ke kanan tanpa cara tersebut pun, jika ada 3 lajur atau lebih, moped harus berbelok ke kanan dengan cara menyeberang dengan lampu pertama, lalu mengubah arah ke kanan, dan menyeberang lagi setelah lampu kedua menjadi biru.", "exp_ja": "この標識があるときは、車両通行帯の数に関係なく、二段階右折をしないで右折する。", "exp_id": "Jika ada rambu ini, moped berbelok ke kanan tanpa cara tersebut, tanpa melihat jumlah lajurnya.", "confirmed": false}, {"no": 109, "cat": "twostep", "answer": false, "by": "claude", "ja": "車両通行帯が2つの道路でも、信号機がある交差点では、原動機付自転車は必ず二段階右折をしなければならない。", "id": "Di jalan yang memiliki 2 lajur pun, jika persimpangannya memiliki lampu lalu lintas, moped wajib berbelok ke kana var pool=[],idx=0,wrong=[],correct=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function start(){

  if(selCat!=="all"&&q.cat!==selCat)continue;if(selMode==="conf"&&!conf[q.no])continue;src.push(q);}

 shuffle(src);pool=selCount?src.slice(0,selCount):src;idx=0;wrong=[];correct=0;show("quiz");renderQ();
}
function renderQ(){

}
function answer(v){
 var q=pool[idx];var ok=(v===q.answer);
 if(ok){correct++;}else{wrong.push(q);}
 var mark=q.answer?"○":"×";
 $("resBox").className="res "+(ok?"ok":"ng");
 $("resBox").innerHTML=(ok?"正解 / Benar":"不正解 / Salah")+"　答え / Jawaban："+mark;
 $("eJa").innerHTML=esc(q.exp_ja);$("eId").innerHTML=esc(q.exp_id);

 $("ansBox").className="ans hide";$("fb").className="";
}
function next(){if(idx<pool.length-1){idx++;renderQ();window.scrollTo(0,0);}else{renderResult();}}

 show("result");

 var h="";
 for(var i=0;i<wrong.length;i++){var q=wrong[i];
  h+='<div class="item"><p class="ja">'+esc(q.ja)+'</p><p class="idn">'+esc(q.id)+'</p><p><b>答え / Jawaban：'+(q.answer?"○":"×")+'</b></p><p>'+esc(q.exp_ja)+'</p><p>'+esc(q.exp_id)+'</p></div>';}
 $("wrongList").innerHTML=h;
}
